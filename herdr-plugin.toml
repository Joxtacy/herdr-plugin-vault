id = "vault"
name = "vault"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Browse and resume past Claude Code sessions"
platforms = ["macos", "linux"]

[[panes]]
id = "vault"
title = "Vault"
placement = "popup"
width = "90%"
height = "80%"
command = ["./vault.sh"]

# Runs server-side so the picker popup can close instead of waiting for the agent.
[[actions]]
id = "launch"
title = "Launch the selected session"
command = ["./vault.sh", "--launch"]
